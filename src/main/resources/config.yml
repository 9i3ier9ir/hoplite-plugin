# hoplite-plugin configuration
# Define each queue lobby. IDs are the numbers used by /lobbycenter and must be unique.
# /lobbycenter <id> saves its center under that lobby entry.
# Each entry needs a lobbyWorld (must already exist on server)
# and a corresponding gameWorld name (will be generated/removed automatically).
# optional maxPlayers and minPlayers per lobby (defaults 10 and 5).
# Center coordinates do not change either value; they only control the lobby's teleport location.

lobbies:
  - lobbyWorld: qwait1
    id: 1
    gameWorld: game1
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait2
    id: 2
    gameWorld: game2
    maxPlayers: 20
    minPlayers: 10
    mode: duos
  - lobbyWorld: qwait3
    id: 3
    gameWorld: game3
    maxPlayers: 20
    minPlayers: 10
    mode: duos
  - lobbyWorld: qwait4
    id: 4
    gameWorld: game4
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait5
    id: 5
    gameWorld: game5
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait6
    id: 6
    gameWorld: game6
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait7
    id: 7
    gameWorld: game7
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait8
    id: 8
    gameWorld: game8
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait9
    id: 9
    gameWorld: game9
    maxPlayers: 10
    minPlayers: 5
  - lobbyWorld: qwait10
    id: 10
    gameWorld: game10
    maxPlayers: 10
    minPlayers: 5

# /lobbycenter <id> writes coordinates here without changing the lobbies list.
# Example:
# lobby-centers:
#   1:
#     world: qwait1
#     x: 0.5
#     y: 65.0
#     z: 0.5
#     yaw: 0.0
#     pitch: 0.0
lobby-centers: {}

# Match timers are per-game and reset when that lobby's match ends.
timers:
  grace-period-seconds: 300
  tracking-compass-minutes: 10

# Set enabled to true on every server that should share player data.
# Create the database first and use the same credentials/table-prefix on all servers.
database:
  enabled: false
  host: localhost
  port: 3306
  name: hoplite
  username: hoplite
  password: change-me
  table-prefix: hoplite_

# Each list is the exact set of commands allowed in that state for non-operators.
# Operators can run any command. List command names without /.
allowed-commands:
  game:
    - teamchat
    - quests
  queue:
    - leaveq
    - quests
  lobby:
    - leaveq
    - party
    - quests

# elo values are stored automatically under the "elo" section

# Duos configuration - optional. Set per-lobby mode by adding `mode: duos` to a lobby entry.
duos:
  enabled: true
  maxPlayersPerLobby: 20
  teamSize: 2
  friendlyFire: false

# Broadcast templates. Supported placeholders: %player%, %platform%, %link%, %owner%, %members%.
messages:
  broadcast: "&6[Live] &e%player% IS LIVE ON %platform%: &b%link%"
  party-broadcast: "&d[Party] &e%owner%'s party members: &f%members%"
